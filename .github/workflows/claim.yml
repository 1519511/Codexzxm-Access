name: Claim Codexzxm Private Preview

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: codexzxm-private-preview-claim
  cancel-in-progress: false
  queue: max

jobs:
  claim:
    if: startsWith(github.event.issue.title, 'Codexzxm Private Preview claim')
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and consume one-time claim
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^claim_token=\([0-9a-fA-F]\{64\}\)$/\1/p' | head -n 1 | tr 'A-F' 'a-f')"
          expected="$(tr -d '\r\n ' < claim/active.sha256)"

          redact_invalid() {
            gh issue edit "$ISSUE_NUMBER" --body 'Claim token redacted. This request was invalid or expired.' >/dev/null
            gh issue comment "$ISSUE_NUMBER" --body 'This one-time claim is invalid or already used. Ask the repository owner for a new claim link.' >/dev/null
            gh issue close "$ISSUE_NUMBER" >/dev/null
          }

          if [[ ! "$token" =~ ^[0-9a-f]{64}$ ]]; then
            redact_invalid
            exit 0
          fi

          actual="$(printf '%s' "$token" | sha256sum | awk '{print $1}')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]] || [[ "$actual" != "$expected" ]]; then
            redact_invalid
            exit 0
          fi

          # Remove the bearer token from the public issue before doing any privileged action.
          gh issue edit "$ISSUE_NUMBER" --body "Claim token redacted after validation. Claimant: @$ACTOR" >/dev/null

          # Fail closed: revoke the token in the public repository before inviting the claimant.
          printf 'used:%s:%s:%s\n' "$ACTOR" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > claim/active.sha256
          git config user.name 'Codexzxm Access Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add claim/active.sha256
          git commit -m "Consume Codexzxm claim for @$ACTOR"
          git push origin HEAD:main
          echo 'valid=true' >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Invite claimant to private repository
        if: steps.claim.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT "repos/1519511/Codexzxm/collaborators/$ACTOR" --silent
          gh issue comment "$ISSUE_NUMBER" --body "Invitation sent to **@$ACTOR** for the private \`1519511/Codexzxm\` repository. Accept the GitHub invitation, then open: https://github.com/1519511/Codexzxm/releases/tag/v0.8.2-preview.0" >/dev/null
          gh issue close "$ISSUE_NUMBER" >/dev/null
        env:
          GH_TOKEN: ${{ secrets.CODEXZXM_ADMIN_TOKEN }}